<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Planner</title>
<meta name="theme-color" content="#FBF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wedding Planner">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FBF7F2;--cream:#F4EBDF;--blush:#F3D9DB;--rose:#B9707B;--roseD:#9C5762;--champ:#CDB28A;--ink:#3A2E2E;--mute:#85766F;--line:#EADFCF;--ok:#2F7D57;--warn:#D97706;--bad:#C0392B}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2,h3,.display{font-family:"Cormorant Garamond",serif;font-weight:600;margin:0}
h1{font-size:34px;margin:6px 0 10px}h2{font-size:28px}h3{font-size:21px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.sub{font-size:13px;color:var(--mute)}.hi{color:var(--bad)}.err{color:var(--bad);font-size:14px;margin:10px 0 0;min-height:1px}
.shell{min-height:100dvh}
.side,.fab span{display:none}
.main{max-width:780px;margin:0 auto;padding:0 16px 120px}
.topbar{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -16px 8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:#fbf7f2ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .display{font-size:22px}.pill{background:var(--blush);color:var(--roseD);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(6,1fr);background:#fffdfa;border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--mute);text-decoration:none;font-size:10.5px}
.tb.on{color:var(--rose);font-weight:600}
a em,.nl em{position:absolute;top:2px;left:55%;background:var(--bad);color:#fff;font-style:normal;font-size:10px;line-height:16px;min-width:16px;text-align:center;border-radius:9px;padding:0 4px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:8px;background:var(--rose);color:#fff;border:0;border-radius:99px;padding:14px;box-shadow:0 6px 18px #b9707b59}
.fab:hover{background:var(--roseD)}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:260px 1fr}.tabbar,.topbar{display:none}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:36px 22px;background:var(--cream);border-right:1px solid var(--line)}
 .brand{font-size:34px;line-height:1.1;margin-bottom:6px}.side nav{margin-top:26px;display:grid;gap:4px}
 .nl{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-size:15px}.nl:hover{background:#ffffff90}.nl.on{background:#fff;color:var(--rose);font-weight:600}
 .nl em{position:static;margin-left:auto}
 .main{padding:34px 36px 100px}.fab{bottom:28px;right:32px;padding:13px 22px}.fab span{display:inline;font-weight:500}
}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.card.flush{padding:4px 16px}
.hero{background:linear-gradient(135deg,var(--blush),var(--cream));border:0;padding:24px 20px}
.count{margin:6px 0 0}.big{font-family:"Cormorant Garamond",serif;font-size:76px;font-weight:600;line-height:1;color:var(--roseD);margin-right:10px}.phase{margin:8px 0 0;color:var(--ink)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}.tile{margin:0;display:grid;gap:6px}.tile b{font-size:28px;font-weight:500;line-height:1.1}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px}.ch h3{margin:0}
.gh{margin:20px 4px 6px;font-size:19px}.gh.hi{color:var(--bad)}
.bar{height:8px;background:var(--cream);border-radius:9px;overflow:hidden;margin:8px 0 0;display:flex}.bar>i{display:block;height:100%;background:var(--rose)}
.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}.bar>i.ok{background:var(--ok)}.bar>i.no{background:var(--champ)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}.stats b{display:block;font-size:19px;font-weight:500}
.note{border-radius:14px;padding:11px 14px;margin-top:14px;font-size:14px;background:var(--cream)}.note.warn{background:#FFEDD5;color:#9A3412}.note.bad{background:#FEE2E2;color:#991B1B}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.grow{flex:1;min-width:0}.right{text-align:right;display:grid;gap:3px;justify-items:end;font-size:15px}
.link{background:none;border:0;padding:0;text-align:left;font-weight:500;display:block;min-height:24px}.link .sub{display:block;font-weight:400}.link.done{color:var(--mute);text-decoration:line-through}.link.sm{font-size:14px;color:var(--rose);font-weight:500}
.chk{appearance:none;flex:none;width:32px;height:32px;min-height:32px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;display:grid;place-content:center;margin:0}
.chk::before{content:"";grid-area:1/1;width:18px;height:18px;border:1.7px solid var(--champ);border-radius:50%;background:#fff}
.chk:checked::before{background:var(--rose);border-color:var(--rose)}
.chk:checked::after{content:"";grid-area:1/1;z-index:1;width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-note{display:block;font-size:12px;line-height:1.4;margin-top:3px;white-space:pre-line;overflow-wrap:anywhere}
.tag{display:grid;text-align:right;font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap}.tag small{font-weight:400;font-size:12px}.tag.late{color:var(--bad)}
.chip{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--cream)}.chip.ok{background:#DCFCE7;color:#166534}.chip.dep{background:#FFEDD5;color:#9A3412}
.mini{border:1px solid var(--rose);color:var(--rose);background:none;border-radius:99px;padding:2px 10px;font-size:12px}.mini:hover{background:var(--blush)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}.seg button,.chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font-size:14px}
.seg button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button:hover{background:var(--blush)}
details summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer}details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}details[open] summary::after{transform:rotate(-135deg)}
details summary .grow b{display:block;font-weight:500}details>.row:first-of-type{border-top:1px solid var(--line)}
.pill-sel{width:auto;border-radius:99px;padding:6px 12px;font-size:13px;border:1px solid var(--line);background:var(--cream)}.pill-sel.attending{background:#DCFCE7;color:#166534}.pill-sel.declined{background:#F3F4F6;color:#6B7280}
.empty{color:var(--mute);text-align:center;padding:18px 8px;margin:0;font-size:14px}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;min-height:44px;border:1px solid #cdb28a80;border-radius:12px;background:#fff}textarea{min-height:76px}
input[type=search]{border-radius:99px}input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);border-color:var(--rose)}
.btn{background:var(--rose);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:500;margin-top:16px;width:100%}.btn:hover{background:var(--roseD)}
.ghost{background:none;border:1px solid #cdb28a99;border-radius:99px;padding:9px 18px;font-size:14px}.ghost:hover{background:var(--cream)}.ghost.sm{padding:5px 14px;font-size:13px}.danger{color:var(--bad);border-color:#c0392b66}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{margin:0;flex:1}
.narrow{max-width:440px;margin:0 auto;padding:44px 20px}
dialog{border:0;border-radius:22px;padding:20px 20px 22px;width:min(480px,94vw);background:var(--ivory);color:var(--ink);max-height:92dvh}dialog::backdrop{background:#3a2e2e66}
@media(max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:none;border:0;color:var(--blush);text-decoration:underline;margin-left:10px}
@media(min-width:900px){#toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.bell{position:relative;background:none;border:0;padding:6px;color:var(--ink);display:grid}.bell em{position:absolute;top:0;right:0;background:var(--bad);color:#fff;font-style:normal;font-size:10px;line-height:16px;min-width:16px;text-align:center;border-radius:9px;padding:0 4px}
.topbar .display{flex:1}@media(min-width:900px){.bell{display:none}}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}.tile:hover{border-color:var(--champ)}
.thumbs{display:flex;gap:6px;margin-top:6px;align-items:center}.th{width:44px;height:44px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--cream)}
.th.big{width:100%;height:auto;aspect-ratio:1}.strip{display:flex;gap:8px;flex-wrap:wrap}.strip .th{width:68px;height:68px}
.grid-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}figure{margin:0}figcaption{font-size:12px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;border:0;color:var(--mute);padding:8px;border-radius:50%;display:grid;place-content:center;flex:none}.icon:hover{color:var(--bad);background:#fee2e2}
.chip.tg{border:1px dashed var(--champ);background:#fff;cursor:pointer;margin-top:4px}.chip.tg.ok{border:0;background:#DCFCE7}
dialog .acts{position:sticky;bottom:-22px;background:var(--ivory);padding:10px 0 2px}
dialog.lb{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:0;border-radius:0;background:#111;color:#fff;flex-direction:column}dialog.lb[open]{display:flex}
.lbx{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}.lbx img{max-width:100%;max-height:100%;object-fit:contain}
.lbbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}.lbbar button,.lbbar a{background:#ffffff26;color:#fff;border:0;border-radius:99px;padding:9px 16px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const vnd = (n) => new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND", maximumFractionDigits: 0 }).format(n || 0);
const fdate = (iso) => iso ? iso.split("-").reverse().join("/") : "—";
const daysUntil = (iso) => { const [y, m, d] = iso.split("-").map(Number); const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y, m-1, d) - t) / 864e5); };
const app = document.getElementById("app");
const show = (el) => { app.replaceChildren(el); };
let project = null;

/* ===================== DỮ LIỆU & TIỆN ÍCH ===================== */
const S = { tab: "home", uid: null, side: null, tasks: [], budget: [], incomes: [], guests: [], notifs: [], members: [], f: { ta: "", ts: "open", tt: "", gq: "", gs: "", gr: "", gi: "", al: "album" } };
let installPrompt = null;
const SIDE = { bride: "Cô dâu", groom: "Chú rể" }, GSIDE = { groom: "Nhà trai", bride: "Nhà gái" };
const GRP = { family: "Gia đình", relative: "Họ hàng", friend: "Bạn bè", colleague: "Đồng nghiệp", other: "Khác" };
const RSVP = { pending: "Chưa xác nhận", attending: "Sẽ tham dự", declined: "Không tham dự" };
const PRIO = { low: "Thấp", medium: "Trung bình", high: "Cao" };
const CATS = ["Nhà hàng","Trang trí","Váy cưới","Vest chú rể","Makeup","Chụp ảnh và quay phim","Thiệp cưới","Nhẫn cưới","Xe cưới","Lễ ăn hỏi","Lễ rước dâu","Chi phí phát sinh","Khác"];
const opts = (o) => Object.entries(o);
const cost = (b) => b.actual_amount > 0 ? b.actual_amount : b.estimated_amount;
const bstat = (b) => { const c = cost(b); return b.paid_amount > 0 && c > 0 && b.paid_amount >= c ? ["Đã thanh toán đủ", "ok"] : b.paid_amount > 0 ? ["Đã đặt cọc", "dep"] : ["Chưa thanh toán", ""]; };
const myName = () => S.side === "bride" ? project.bride_name : project.groom_name;
const sel = (o, v, all) => (all ? `<option value="">${all}</option>` : "") + opts(o).map(([k, l]) => `<option value="${k}"${k === v ? " selected" : ""}>${esc(l)}</option>`).join("");
const fmtTime = (iso) => { const d = new Date(iso); return d.toLocaleDateString("vi-VN") + " " + d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }); };
const lateTag = (t) => { if (!t.due_date) return ""; const d = daysUntil(t.due_date); return `<span class="tag ${d < 0 && !t.done ? "late" : ""}">${fdate(t.due_date)}${t.done ? "" : d < 0 ? " · quá hạn " + -d + " ngày" : d <= 7 ? " · còn " + d + " ngày" : ""}</span>`; };

function budgetTotals() {
  const planned = S.budget.reduce((s, b) => s + b.estimated_amount, 0);
  const committed = S.budget.reduce((s, b) => s + cost(b), 0);
  const paid = S.budget.reduce((s, b) => s + b.paid_amount, 0);
  const total = project.total_budget;
  return { planned, committed, paid, owed: Math.max(committed - paid, 0), remain: total - committed, usage: total > 0 ? committed / total : 0 };
}
const alerts = () => S.tasks.filter((t) => !t.done && t.due_date && daysUntil(t.due_date) <= 3);


/* ---- Lưu trữ cục bộ (localStorage), không cần tài khoản ---- */
const KEY = "wp_db_v1";
let DB = null;
let applyingRemote = false;
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
const persist = () => {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch { alert("Không lưu được dữ liệu: bộ nhớ trình duyệt bị đầy hoặc bị chặn. Hãy xuất file sao lưu ngay."); }
  if (!applyingRemote && DB) window.wpCloud?.onLocalChange?.(JSON.parse(JSON.stringify(DB)));
};
const pad = (n) => String(n).padStart(2, "0");
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
/* Lịch mẫu thông minh: nếu còn ít hơn 12 tháng, các mốc dài hạn được co lại theo thời gian còn lại và không bao giờ rơi vào quá khứ */
const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const tplDate = (w, off) => {
  if (off >= -30) { const d = addDays(w, off); return d < todayISO() && w >= todayISO() ? todayISO() : d; }
  const sc = Math.min(1, Math.max(Math.max(daysUntil(w), 0) / 365, 0.08));
  const d = addDays(w, Math.min(Math.round(off * sc), -30));
  return d < todayISO() && w >= todayISO() ? todayISO() : d;
};
const TPL = [
  ["m12_plan", "Lên kế hoạch tổng thể", "Thống nhất phong cách, quy mô và các mốc chính.", -365, null, "high"],
  ["m12_budget", "Xác định ngân sách", "Chốt tổng ngân sách và nguồn hỗ trợ từ hai bên gia đình.", -365, null, "high"],
  ["m12_venue", "Chọn địa điểm tổ chức", "Tham quan, so sánh và đặt lịch giữ chỗ.", -350, null, "high"],
  ["m6_dress", "Chọn váy cưới và vest", "Thử đồ, đặt may hoặc thuê.", -180, "bride", "medium"],
  ["m6_photo", "Chụp ảnh cưới", "Chọn studio, concept và lịch chụp.", -170, null, "medium"],
  ["m6_venue", "Đặt nhà hàng", "Chốt menu, số bàn và đặt cọc.", -180, null, "high"],
  ["m3_cards", "Đặt thiệp cưới", "Thiết kế, in và chuẩn bị gửi thiệp.", -90, null, "medium"],
  ["m3_guests", "Lập danh sách khách mời", "Tổng hợp danh sách từ hai bên gia đình.", -90, null, "high"],
  ["m1_rsvp", "Xác nhận khách mời", "Liên hệ từng khách để chốt số lượng tham dự.", -30, null, "high"],
  ["m1_outfit", "Kiểm tra trang phục và dịch vụ", "Thử đồ lần cuối, xác nhận lịch makeup, xe, quay chụp.", -30, null, "medium"],
  ["w1_review", "Kiểm tra toàn bộ công việc", "Rà soát checklist, thanh toán còn lại và sơ đồ bàn.", -7, null, "high"],
  ["d0_morning", "Chuẩn bị buổi sáng ngày cưới", "Makeup, trang phục, nhẫn cưới, lễ vật.", 0, null, "high"],
  ["d0_ceremony", "Thực hiện nghi lễ và đón khách", "Phân công người đón khách, quản lý phong bì.", 0, null, "high"],
  ["d0_wrapup", "Thanh toán và bàn giao cuối ngày", "Thanh toán số còn lại, thu dọn và gửi lời cảm ơn.", 0, null, "medium"],
];
/* Chỉ thêm việc mẫu chưa có (theo mã) và chưa bị bạn xóa: đổi ngày cưới không tạo trùng */
function seedTasks() {
  const have = new Set([...DB.tasks.map((t) => t.template_key).filter(Boolean), ...DB.deleted_keys]);
  TPL.forEach(([k, title, description, off, assignee, priority]) => { if (!have.has(k))
    DB.tasks.push({ id: uid(), title, description, offset_days: off, due_date: tplDate(DB.project.wedding_date, off), assignee, priority, done: false, notes: null, template_key: k, date_locked: false, created_at: new Date().toISOString() }); });
}
function sync() {
  project = DB.project;
  S.tasks = [...DB.tasks].sort((a, b) => (a.due_date || "9999").localeCompare(b.due_date || "9999"));
  S.budget = DB.budget_items; S.incomes = DB.incomes;
  S.guests = [...DB.guests].sort((a, b) => a.full_name.localeCompare(b.full_name, "vi"));
  S.notifs = [...DB.notifications].reverse();
  render(); dailyReminder();
}
function notify(kind, message) {
  DB.notifications.push({ id: uid(), kind, message: message[0].toUpperCase() + message.slice(1), created_at: new Date().toISOString() });
  DB.notifications = DB.notifications.slice(-100); persist(); sync();
}
async function save(table, id, obj) {
  if (id) Object.assign(DB[table].find((x) => x.id === id), obj);
  else DB[table].push({ id: uid(), created_at: new Date().toISOString(), ...(table === "tasks" ? { done: false, template_key: null, date_locked: false } : {}), ...obj });
  persist(); sync(); return null;
}
async function remove(table, id) {
  const r = DB[table].find((x) => x.id === id); if (!r) return;
  if (table === "tasks" && r.template_key) DB.deleted_keys.push(r.template_key);
  DB[table] = DB[table].filter((x) => x.id !== id); persist(); sync();

  albCam: () => pickPhotos(true, (f) => addPhotos(f, "album", "album")), albLib: () => pickPhotos(false, (f) => addPhotos(f, "album", "album")),
  setf: (_, el) => { S.f[el.dataset.k] = el.dataset.v; render(); },
  payFull: (id) => { const x = DB.budget_items.find((i) => i.id === id); x.paid_amount = cost(x); persist(); notify("budget", `đã thanh toán đủ khoản "${x.name}"`); toast("Đã ghi nhận thanh toán đủ"); },
  perm: async () => { await Notification.requestPermission(); render(); },
  installApp: async () => {
    if (!installPrompt) return toast("Hãy dùng menu trình duyệt để thêm ứng dụng vào màn hình chính.");
    const prompt = installPrompt;
    await prompt.prompt();
    const choice = await prompt.userChoice;
    installPrompt = null;
    if (choice.outcome === "accepted") toast("Đã bắt đầu cài đặt ứng dụng");
    render();
  },
  backup: () => doBackup(),
  resetAll: () => { if (confirm("Xóa toàn bộ dữ liệu đám cưới trên máy này? Không thể hoàn tác.") && confirm("Bạn thật sự chắc chắn? Hãy xuất file sao lưu trước nếu cần.")) { localStorage.removeItem(KEY); clearPhotos(); DB = null; start(); } },
  saveProject: () => {
    const q = (s) => document.getElementById(s).value.trim(), e = document.getElementById("s_e"); e.textContent = "";
    if (!q("s_b") || !q("s_g")) return e.textContent = "Hãy nhập tên cô dâu và chú rể.";
    if (!q("s_d")) return e.textContent = "Hãy chọn ngày cưới.";
    const total = Number(q("s_t") || 0); if (!(total >= 0)) return e.textContent = "Ngân sách phải là số không âm.";
    const dateChanged = q("s_d") !== DB.project.wedding_date, budgetChanged = total !== DB.project.total_budget;
    if (dateChanged && !confirm("Đổi ngày cưới sẽ dời hạn các công việc mẫu (trừ việc bạn đã tự chỉnh ngày). Tiếp tục?")) return;
    Object.assign(DB.project, { bride_name: q("s_b"), groom_name: q("s_g"), wedding_date: q("s_d"), total_budget: total });
    if (dateChanged) { DB.tasks.forEach((t) => { if (t.template_key && !t.date_locked) t.due_date = tplDate(q("s_d"), t.offset_days); }); seedTasks(); }
    persist(); if (budgetChanged) notify("budget", `đã đổi tổng ngân sách thành ${vnd(total)}`); if (dateChanged) notify("project", `đã đổi ngày cưới thành ${fdate(q("s_d"))}`);
    sync(); toast("Đã lưu thay đổi");
  },
};
const changes = {
  toggle: (el) => { const t = DB.tasks.find((x) => x.id === el.dataset.id); t.done = el.checked; persist(); notify("task", `${el.checked ? "đã hoàn thành" : "mở lại"} công việc "${t.title}"`); },
  rsvp: (el) => { DB.guests.find((x) => x.id === el.dataset.id).rsvp = el.value; persist(); sync(); },
  restore: (el) => { const f = el.files[0]; if (f) restoreFile(f, true); },
};
app.addEventListener("click", (e) => {
  const pv = e.target.closest("[data-pv]");
  if (pv) {
    const o = pv.dataset.o;
    return openLightbox(o === "*album" ? PH.list.filter((p) => p.type === "album") : o === "*docs" ? PH.list.filter((p) => p.type !== "album") : photosOf(o), pv.dataset.pv);
  }
  const a = e.target.closest("[data-a]");
  if (a) {
    e.preventDefault();
    acts[a.dataset.a]?.(a.dataset.id, a);
    return;
  }
  const n = e.target.closest("[data-tab]");
  if (n) {
    e.preventDefault();
    S.tab = n.dataset.tab;
    render();
    scrollTo(0, 0);
  }
});
app.addEventListener("change", (e) => { const c = e.target.closest("[data-c]"); if (c) changes[c.dataset.c]?.(c); });
app.addEventListener("input", (e) => { if (e.target.dataset.i === "gq") { S.f.gq = e.target.value; document.getElementById("glist").innerHTML = guestList(); } });
app.addEventListener("toggle", (e) => { const k = e.target.dataset?.k; if (k) e.target.open ? S.closed.delete(k) : S.closed.add(k); }, true);

/* ===================== KHUNG HIỂN THỊ & KHỞI ĐỘNG ===================== */
const FAB = { tasks: ["addTask", "Thêm việc"], budget: ["addBudget", "Thêm khoản chi"], guests: ["addGuest", "Thêm khách"] };
function render() {
  if (!project) return;
  const y = window.scrollY;
  const n = S.tasks.filter((t) => !t.done && t.due_date && daysUntil(t.due_date) <= 3).length + payAlerts().length, d = daysUntil(project.wedding_date);
  const link = (cls) => ([k, l, i]) => `<a href="#" data-tab="${k}" class="${cls}${S.tab === k ? " on" : ""}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic(i)}<span>${l}</span>${k === "notif" && n ? `<em>${n}</em>` : ""}</a>`;
  const fab = FAB[S.tab] ? `<button class="fab" data-a="${FAB[S.tab][0]}" aria-label="${FAB[S.tab][1]}"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>${FAB[S.tab][1]}</span></button>` : "";
  app.innerHTML = `<div class="shell"><aside class="side"><div class="display brand">${esc(project.bride_name)}<br>&amp; ${esc(project.groom_name)}</div>
    <p class="sub">${fdate(project.wedding_date)} · ${d > 0 ? `còn ${d} ngày` : d === 0 ? "hôm nay" : "đã cưới"}</p><nav>${TABS.map(link("nl")).join("")}</nav></aside>
    <main class="main"><header class="topbar"><span class="display">${esc(project.bride_name)} &amp; ${esc(project.groom_name)}</span><span class="pill">${d > 0 ? `Còn ${d} ngày` : d === 0 ? "Hôm nay" : "Đã cưới"}</span><button class="bell" data-tab="notif" aria-label="Nhắc việc">${ic("bell")}${n ? `<em>${n}</em>` : ""}</button></header>${V[S.tab]()}</main>${fab}
    <nav class="tabbar" aria-label="Điều hướng chính">${TABS.filter((t) => t[0] !== "notif").map(link("tb")).join("")}</nav></div>`;
  scrollTo(0, y);
}
function dailyReminder() {
  const n = S.tasks.filter((t) => !t.done && t.due_date && daysUntil(t.due_date) <= 3).length + payAlerts().length, key = "wp_rem_" + new Date().toDateString();
  if ("Notification" in window && Notification.permission === "granted" && n && !localStorage.getItem(key)) { localStorage.setItem(key, "1"); new Notification("Wedding Planner", { body: `${n} việc hoặc khoản thanh toán cần chú ý.` }); }
}
function screenOnboarding() {
  const el = $(`<div class="narrow"><h1 class="display" style="font-size:44px">Wedding Planner</h1><p class="sub">Nhập vài thông tin để bắt đầu. Dữ liệu chỉ lưu trên máy của bạn.</p>
    <div class="card"><label>Tên cô dâu</label><input id="b" maxlength="80"><label>Tên chú rể</label><input id="g" maxlength="80">
    <label>Ngày cưới</label><input id="d" type="date"><label>Tổng ngân sách dự kiến (VNĐ, có thể bỏ trống)</label><input id="t" type="number" min="0" step="1000000" inputmode="numeric">
    <p class="err" id="e" role="alert"></p><button class="btn" id="go">Bắt đầu lên kế hoạch</button>
    <label class="ghost" style="display:block;text-align:center;margin-top:12px;cursor:pointer">Khôi phục từ file sao lưu<input type="file" accept=".json,application/json" id="rs" hidden></label></div>
    <div id="cloudbox">${window.wpCloudUI?.() || '<section class="card"><h3>Tài khoản & đồng bộ</h3><p class="sub">Mở website qua HTTPS để đăng nhập và tham gia dự án dùng chung.</p></section>'}</div></div>`);
  const q = (s) => el.querySelector(s);
  q("#go").onclick = () => {
    if (!q("#b").value.trim() || !q("#g").value.trim()) return q("#e").textContent = "Hãy nhập tên cô dâu và chú rể.";
    if (!q("#d").value) return q("#e").textContent = "Hãy chọn ngày cưới.";
    const t = Number(q("#t").value || 0); if (!(t >= 0)) return q("#e").textContent = "Ngân sách phải là số không âm.";
    DB = { project: { bride_name: q("#b").value.trim(), groom_name: q("#g").value.trim(), wedding_date: q("#d").value, total_budget: t }, tasks: [], budget_items: [], incomes: [], guests: [], notifications: [], deleted_keys: [] };
    seedTasks(); persist(); navigator.storage?.persist?.(); sync();
  };
  q("#rs").onchange = (e) => { const f = e.target.files[0]; if (f) restoreFile(f, false, (m) => (q("#e").textContent = m)); };
  show(el);
}
function start() { try { DB = JSON.parse(localStorage.getItem(KEY)); } catch { DB = null; } DB ? sync() : screenOnboarding(); }
window.wpApp = {
  getData: () => DB ? JSON.parse(JSON.stringify(DB)) : null,
  hasData: () => Boolean(DB),
  currentTab: () => S.tab,
  render,
  backup: doBackup,
  applyRemote(data) {
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.budget_items) || !data.project?.wedding_date) {
      throw new Error("Dữ liệu đồng bộ không hợp lệ.");
    }
    DB = { incomes: [], notifications: [], deleted_keys: [], guests: [], ...data };
    applyingRemote = true;
    try { persist(); }
    finally { applyingRemote = false; }
    sync();
  },
  photos: () => [...PH.list],
  async photoRecords() {
    if (!idb) return [];
    const records = [];
    for (const meta of PH.list) {
      const [thumb, full] = await Promise.all([
        idbDo(["photos"], "readonly", (p) => p.get(meta.id)),
        idbDo(["full"], "readonly", (p) => p.get(meta.id)),
      ]);
      if (thumb && full) records.push({ meta, thumb: thumb.thumb, full: full.blob });
    }
    return records;
  },
  async storeRemotePhoto(meta, thumb, full) {
    if (!PH.list.some((p) => p.id === meta.id)) await storePhoto(meta.id, meta.owner, meta.type, meta.name || "", meta.created_at, thumb, full);
    render();
  },
  removeLocalPhoto: deletePhotoRec,
  clearLocalPhotos: clearPhotos,
};
window.addEventListener("storage", (e) => { if (e.key === KEY && DB) start(); });
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && DB && start());
start();
window.wpPhotosReady = openIDB().then(async (d) => { idb = d; if (d) { try { await loadPhotos(); if (DB) await cleanOrphans(); } catch (error) { console.error("Không tải được ảnh cục bộ:", error); } if (DB) render(); } });
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installPrompt = e;
  if (DB && S.tab === "settings") render();
});
window.addEventListener("appinstalled", () => { installPrompt = null; toast("Wedding Planner đã được cài đặt"); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  navigator.serviceWorker.register("./sw.js").catch((error) => console.error("Không đăng ký được service worker:", error));
}
if (location.protocol !== "file:") {
  const cloudScript = document.createElement("script");
  cloudScript.type = "module";
  cloudScript.src = "./cloud.js";
  document.head.appendChild(cloudScript);
}
</script>
</body>
</html>
